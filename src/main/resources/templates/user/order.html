<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
</head>

<body>
    <section>
        <div class="container mt-5 p-5">
            <form action="/user/save-order" method="post" id="orders" novalidate>
                <div class="row">
                    <div class="col-md-6 p-3">
                        <p class="text-center fs-4">Billing Address</p>
                        <hr>

                        <div class="row">
                            <div class="col mb-3">
                                <label for="firstName" class="form-label">First Name</label>
                                <input type="text" class="form-control" name="firstName" required>
                            </div>
                            <div class="col mb-3">
                                <label for="lastName" class="form-label">Last Name</label>
                                <input type="text" class="form-control" name="lastName" required>
                            </div>
                        </div>


                        <div class="row">
                            <div class="col mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" name="email" required>
                            </div>
                            <div class="col mb-3">
                                <label for="mobileNo" class="form-label">Mobile Number</label>
                                <input type="tel" class="form-control" name="mobileNo" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col mb-3">
                                <label for="address" class="form-label">Address</label>
                                <input type="text" class="form-control" name="address" required>
                            </div>
                            <div class="col mb-3">
                                <label for="city" class="form-label">City</label>
                                <input type="text" class="form-control" name="city" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col mb-3">
                                <label for="state" class="form-label">State</label>
                                <input type="text" class="form-control" name="state" required>
                            </div>
                            <div class="col mb-3">
                                <label for="pincode" class="form-label">Pincode</label>
                                <input type="number" class="form-control" name="pincode" required>
                            </div>
                        </div>


                    </div>
                    <div class="col-md-6 p-3">
                        <p class="text-center fs-4">Payment Type</p>
                        <hr>

                        <div class="card">
                            <div class="card-body">
                                <table class="table table-borderless">
                                    <tbody>
                                        <tr>
                                            <td>Total Price</td>
                                            <td>:</td>
                                            <td>&#8377; [[${orderPrice}]]</td>
                                        </tr>
                                        <tr>
                                            <td>Delivery Fee</td>
                                            <td>:</td>
                                            <td>&#8377; 250</td>
                                        </tr>
                                        <tr>
                                            <td>Tax</td>
                                            <td>:</td>
                                            <td>&#8377; 100</td>
                                        </tr>
                                        <tr class="border-top">
                                            <td>Total Price</td>
                                            <td>:</td>
                                            <td>&#8377; [[${totalOrderPrice}]]</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="card shadow p-3 mb-5 mt-2 bg-body-tertiary rounded">

                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label">Select Payment Type</label>
                                    <select class="form-control" name="paymentType" id="" required>
                                        <option value="">--select--</option>
                                        <option value="COD">Cash On Delivery</option>
                                        <option value="ONLINE">Online Payment</option>
                                    </select>
                                </div>

                                <button class="btn bg-primary text-white col-md-12">Place Order</button>

                            </div>

                        </div>
                    </div>
                </div>
            </form>
        </div>
    </section>
</body>

</html>
